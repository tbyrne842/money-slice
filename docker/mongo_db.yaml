services:
  mongo:
    image: mongo:7
    container_name: money-slice-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Optional: lightweight web UI for browsing collections without mongosh.
  # Handy for eyeballing imported transactions. Delete this block if you'd
  # rather not run it.
  mongo-express:
    image: mongo-express:latest
    container_name: money-slice-mongo-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  mongo_data:
