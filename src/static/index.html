<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Money Slice</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">£</span>
        <div>
          <h1>Money Slice</h1>
          <p class="subtitle">Transaction browser</p>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="upload-panel">
      <div class="upload-panel-header">
        <h2>Upload a statement</h2>
        <button id="toggle-upload" class="text-btn">Show</button>
      </div>
      <form id="upload-form" hidden>
        <div class="filters-grid">
          <div class="field">
            <label for="upload-file">CSV file</label>
            <input type="file" id="upload-file" accept=".csv" required />
          </div>
          <div class="field">
            <label for="upload-account">Account ID</label>
            <input type="text" id="upload-account" placeholder="e.g. natwest-tiarnan" required />
          </div>
          <div class="field">
            <label for="upload-mapping">Bank mapping</label>
            <select id="upload-mapping" required>
              <option value="" disabled selected>Loading&hellip;</option>
            </select>
          </div>
          <div class="field">
            <label for="upload-source">Source</label>
            <input type="text" id="upload-source" value="csv" />
          </div>
        </div>
        <div class="upload-actions">
          <button type="submit" id="upload-submit">Upload</button>
          <span id="upload-status"></span>
        </div>
      </form>
      <div id="upload-result" class="upload-result" hidden></div>
    </section>

    <section class="upload-panel">
      <div class="upload-panel-header">
        <h2>Add a transaction manually</h2>
        <button id="toggle-add" class="text-btn">Show</button>
      </div>
      <form id="add-form" hidden>
        <div class="filters-grid">
          <div class="field">
            <label for="add-account">Account ID</label>
            <input type="text" id="add-account" placeholder="e.g. natwest-tiarnan" required />
          </div>
          <div class="field">
            <label for="add-date">Date</label>
            <input type="date" id="add-date" required />
          </div>
          <div class="field">
            <label for="add-amount">Amount</label>
            <input type="number" step="0.01" id="add-amount" placeholder="-12.50 = spend" required />
          </div>
          <div class="field search-field">
            <label for="add-description">Description</label>
            <input type="text" id="add-description" placeholder="Merchant / description" required />
          </div>
          <div class="field">
            <label for="add-category">Category</label>
            <select id="add-category">
              <option value="">Auto-categorise</option>
            </select>
          </div>
          <div class="field">
            <label for="add-shared">Shared</label>
            <select id="add-shared">
              <option value="">Auto (from category default)</option>
              <option value="true">Shared</option>
              <option value="false">Personal</option>
            </select>
          </div>
        </div>
        <div class="upload-actions">
          <button type="submit" id="add-submit">Add transaction</button>
          <span id="add-status"></span>
        </div>
      </form>
      <div id="add-result" class="upload-result" hidden></div>
    </section>

    <section class="filters">
      <div class="filters-grid">
        <div class="field">
          <label for="account">Account</label>
          <select id="account"><option value="">All accounts</option></select>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category"><option value="">All categories</option></select>
        </div>
        <div class="field">
          <label for="shared">Shared</label>
          <select id="shared">
            <option value="">All</option>
            <option value="true">Shared</option>
            <option value="false">Personal</option>
          </select>
        </div>
        <div class="field">
          <label for="start">From</label>
          <input type="date" id="start" />
        </div>
        <div class="field">
          <label for="end">To</label>
          <input type="date" id="end" />
        </div>
        <div class="field search-field">
          <label for="search">Search</label>
          <input type="text" id="search" placeholder="Merchant, description..." />
        </div>
      </div>
      <button id="clear-filters" class="text-btn">Clear filters</button>
    </section>

    <section class="results-info">
      <span id="results-count"></span>
    </section>

    <div class="table-wrap">
      <table id="results-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Account</th>
            <th>Category</th>
            <th>Shared</th>
            <th class="amount-col">Amount</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <div id="empty-state" class="empty-state" hidden>No transactions match these filters.</div>
      <div id="loading-state" class="loading-state" hidden>Loading&hellip;</div>
    </div>

    <section class="pagination">
      <button id="prev-page">&larr; Previous</button>
      <span id="page-info"></span>
      <button id="next-page">Next &rarr;</button>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
