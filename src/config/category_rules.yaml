# Rule-based categorization. Matching is case-insensitive substring
# search against description_raw, checked in file order - first match
# wins, so put more specific rules above general ones.
#
# This will never be perfect (bank descriptions are inconsistent junk),
# that's expected. The goal is to auto-categorize 80%+ so the weekly
# "review uncategorized" pass is small.
#
# Substring matching works regardless of a payment processor prefix
# (DOJO*, SQ *, ZETTLE_*, SHIFT4*, SUMUP *) - so most entries below
# match on the venue name itself, not the processor.
#
# A few entries deliberately override Amex's own category hint where it
# looks like an MCC misclassification (e.g. Space NK tagged "Pharmacies",
# Flannels tagged "Sporting Goods", Molton Brown tagged "Groceries") -
# these are noted inline.

